<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <title>Bille Céleste</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet" />
    <script>
      window.addEventListener('error', function (e) {
        var d = document.getElementById('err');
        if (d) {
          d.hidden = false;
          d.textContent = 'Erreur : ' + (e.message || 'chargement impossible');
        }
      });
      setTimeout(function () {
        if (!window.__ok) {
          var d = document.getElementById('err');
          if (d) {
            d.hidden = false;
            d.textContent = 'Le moteur 3D ne s’est pas chargé. Vérifie ta connexion puis recharge la page.';
          }
        }
      }, 12000);
    </script>
  </head>
  <body>
    <canvas id="c"></canvas>

    <div class="hud">
      <div class="pill"><span id="crLabel">Cristaux</span> <b id="cr">0/0</b></div>
      <div class="pill" id="tm">0:00.0</div>
      <div class="pill"><span id="flLabel">Chutes</span> <b id="fl">0</b></div>
      <div class="effects" id="fx" aria-live="polite"></div>
    </div>
    <div class="perf" id="perf" hidden></div>

    <div class="joy" id="joy"><div class="knob" id="knob"></div></div>
    <div class="toast" id="toast"></div>

    <div id="ui"></div>

    <div id="err" hidden></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
